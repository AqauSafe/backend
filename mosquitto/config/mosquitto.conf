# AquaSafe Mosquitto configuration.
#
# Development: plain MQTT on 1883 with username/password and topic ACLs.
# Production: enable the TLS listener below and provide certificates.
#
# Generate the password file before starting the broker:
#   make broker-init
#
# Never commit mosquitto/config/passwd.

listener 1883
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# ---------------------------------------------------------------------------
# Production TLS listener. Uncomment and provide mounted certificates.
# ---------------------------------------------------------------------------
# listener 8883
# allow_anonymous false
# password_file /mosquitto/config/passwd
# acl_file /mosquitto/config/acl
# cafile /mosquitto/config/certs/ca.crt
# certfile /mosquitto/config/certs/server.crt
# keyfile /mosquitto/config/certs/server.key
# require_certificate false
# tls_version tlsv1.2
