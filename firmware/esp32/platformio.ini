[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.2.0
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -DAQUASAFE_FIRMWARE_VERSION=\"0.1.0\"
lib_ldf_mode = deep+
